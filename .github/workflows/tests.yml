name: tests

# analyzer 已 public，跨仓库 checkout 用默认凭据即可，无需 PAT secret。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 —— tests/test_backfill_pool_history.py 需要完整 git 历史
      # 才能重建自选股池台账（默认的浅克隆会让它拿到空历史而断言失败）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # monitor 的 src/crawler.py 通过 _ensure_xueqiu_analyzer_path() 引用 analyzer
      - name: Checkout analyzer
        uses: actions/checkout@v4
        with:
          repository: winterswang/xueqiu-analyzer-skill
          path: _deps/xueqiu-analyzer-skill

      # 插件已独立成仓（2026-10-12）。tests/plugin_source.py 按「env → _deps → 已安装插件」
      # 解析插件源码；解析不到会 AssertionError（故意失败，不跳过）。
      # ref 固定：只有主动「升 ref」时，对岸改动才会影响这里的守卫。
      - name: Checkout opencli-adapters
        uses: actions/checkout@v4
        with:
          repository: winterswang/opencli-adapters
          # 2026-11-09 升 ref：81de5ce 移除 `opencli xueqiu hot`（opencli-adapters#16，
          # 随价值投资日报热榜功能下线）——插件命令 7 → 6 条；
          # xueqiu-crawler 的 test_opencli_command_names 守卫数同步改成 6。
          # 上一版 c68d166（2026-10-18）：滚动小时额度 #10 / 熔断状态目录 #7 /
          # CI 补 npm ci #11，中间落了 af0f0b7（xueqiu hot 适配器）。
          ref: 81de5ce265d82c4d0df59105d8bef34c8ee394b9
          path: _deps/opencli-adapters

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e _deps/xueqiu-analyzer-skill

      - name: Run tests
        env:
          # 相对时间测试按生产时区解释；UTC 凌晨会把“2小时前”落到前一天。
          TZ: Asia/Shanghai
          # 显式指向 sibling checkout；pip install -e 之后其实已可 import，
          # 这里再钉一次，避免将来装包方式变化时静默走错路径。
          XUEQIU_ANALYZER_PATH: ${{ github.workspace }}/_deps/xueqiu-analyzer-skill/src
        run: python -m pytest tests/ -q
